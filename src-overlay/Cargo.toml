[package]
name = "overlay_ui"
publish = false
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
egui = { version = "0.32.0", default-features = false, features = ["persistence"] }
tracing = { version = "0.1", default-features = false }
egui_overlay = { version = "0.10", features = ["three_d"], git = "https://github.com/Jackzmc/egui_overlay"}
egui_window_glfw_passthrough = { version = "0.9" }
dotenvy = "0.15.7"
reqwest = "0.12.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "*"
active-win-pos-rs = "0.8"
tokio = "1.37.0"
overlay_manager = { path = "../src-manager" }
keyring = "2"
webbrowser = "1.0.0"
tungstenite = "0.21.0"
egui_extras = { version = "0.32.0", features = ["http", "image", "svg"] }
image = { version = "0.25", features = ["png", "jpeg"] }
strum = "0.27.1"
strum_macros = "0.27.1"
uuid = "1.17.0"
steamid-ng = "2.0.0"
directories-next = "2.0.0"
global-hotkey = "0.7.0"
daemonize = "0.5.0"
fork = "0.2.0"
libc = "1.0.0-alpha.1"