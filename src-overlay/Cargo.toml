[package]
name = "overlay_client"
publish = false
edition = "2024"

[dependencies]
tracing-subscriber = { workspace = true }
egui = { version = "0.32.0", default-features = false, features = ["persistence"] }
tracing = { workspace = true }
egui_overlay = { version = "0.10", features = ["three_d"], git = "https://github.com/Jackzmc/egui_overlay"}
egui_window_glfw_passthrough = { version = "0.9" }
dotenvy = { workspace = true }
reqwest = "0.12.22"
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "*"
active-win-pos-rs = "0.8"
tokio = "1.37.0"
overlay_manager = { path = "../src-manager" }
keyring = "2"
webbrowser = "1.0.0"
tungstenite = { workspace = true }
egui_extras = { version = "0.32.0", features = ["http", "image", "svg"] }
image = { version = "0.25", features = ["png", "jpeg"] }
strum = "0.27.1"
strum_macros = "0.27.1"
uuid = "1.17.0"
steamid-ng = "2.0.0"
directories-next = "2.0.0"
global-hotkey = "0.7.0"
daemonize = "0.5.0"
fork = "0.2.0"
libc = "1.0.0-alpha.1"
overlay_common = { path = '../common' }
